services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kart_order_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432" # host 5432/5433/5434 may already be bound by other local kart-* services
    volumes:
      - order-postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7.0
    ports:
      - "27020:27017" # host 27017/27018/27019 may already be bound by other local kart-* services
    volumes:
      - order-mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      # RabbitMQ's default "guest" user is restricted to loopback-only connections - a container
      # reaching it over the compose bridge network does not count as loopback, so a dedicated
      # non-guest user is required (same fix kart-payment-service/docker-compose.yml applies).
      RABBITMQ_DEFAULT_USER: "order"
      RABBITMQ_DEFAULT_PASS: "order"
    ports:
      - "5674:5672"
      - "15674:15672"

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # ${ORDER_PORT} matches kart-devops/ports.env's canonical value for this service --
      # `source ../kart-devops/ports.env` first to pick it up automatically; the :-8088 fallback
      # is only for running this repo fully standalone, with no kart-devops checkout alongside it.
      - "${ORDER_PORT:-8088}:8080"
    environment:
      ConnectionStrings__OrderDatabase: "Host=postgres;Port=5432;Database=kart_order_dev;Username=postgres;Password=postgres"
      Mongo__ConnectionString: "mongodb://mongo:27017"
      Mongo__Database: "kart_order_read_dev"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "order"
      RabbitMq__Password: "order"
      # host.docker.internal:<port> reaches each dependency's own local dev port (its
      # launchSettings.json http profile / kart-devops/ports.env host port — both now aligned)
      # on the host machine, since neither inventory nor payment has a container here. Same
      # ${INVENTORY_PORT}/${PAYMENT_PORT} vars as kart-devops/ports.env; :- fallbacks are its
      # current canonical values for running this repo standalone.
      Inventory__BaseUrl: "http://host.docker.internal:${INVENTORY_PORT:-8086}"
      Payment__BaseUrl: "http://host.docker.internal:${PAYMENT_PORT:-8089}"
    depends_on:
      - postgres
      - mongo
      - rabbitmq

volumes:
  order-postgres-data:
  order-mongo-data:
